name: P0 browser and receipt preflight

on:
  push:
    branches:
      - research/dots-readiness-v0.1
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout pinned branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0" "opentelemetry-api==1.42.1" "opentelemetry-sdk==1.42.1"

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Validate pinned source manifests
        run: python -m json.tool research/agent-surfaces/OSS_P0_PINNED_SOURCES_v0.1.json >/dev/null

      - name: Run receipt tests
        run: python -m unittest tests/test_dots_receipt.py

      - name: Run browser and trace preflight
        run: python research/agent-surfaces/lab/p0_browser_otel_preflight.py
