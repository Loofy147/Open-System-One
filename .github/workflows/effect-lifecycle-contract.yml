name: effect-lifecycle-contract

on:
  push:
    branches: ["main", "contract/effect-identity-reconciliation-v0.1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-effect-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install -r requirements-conformance.txt
      - name: Validate effect identity, attempts and reconciliation fixtures
        run: python scripts/validate_effect_lifecycle_fixtures.py
