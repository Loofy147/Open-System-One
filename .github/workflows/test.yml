name: test

on:
  pull_request:
  push:
    branches:
      - main
      - foundation/v0.1
      - recovery/v0.3-frontier

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
